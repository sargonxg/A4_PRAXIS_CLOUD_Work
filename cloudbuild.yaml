steps:
  # ── Model string guard — must run before any build ──────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -rE "gemini-2\.0|gemini-3-flash-preview|gemini-3-pro-preview|claude-|gpt-|firecrawl|tavily|parallel-web|@ai-sdk/anthropic" src/ backend/ --include="*.ts" --include="*.tsx" --include="*.py" --exclude="providers.ts" --exclude="providers.py" --exclude="model-matrix-data.ts" 2>/dev/null; then
          echo "ERROR: Forbidden retired/unavailable model strings found. Use src/lib/ai/providers.ts (frontend) or backend/config.py (backend)."
          exit 1
        fi
        echo "OK: no forbidden model strings"
    id: 'check-model-strings'

  # ── Preflight: AI-route calibration audit (zero-dep .mjs, no npm install) ──
  - name: 'node:22-slim'
    entrypoint: 'node'
    args: ['scripts/audit-ai-routes.mjs']
    id: 'preflight-audit-routes'
    waitFor: ['check-model-strings']

  # ── Preflight: GCP resource audit via gcloud (uses build-step default SA) ──
  # Requires Cloud Build SA to have reader roles on the target resources; see
  # infrastructure/grant-cloudbuild-audit-iam.sh for the exact bindings.
  # Set substitution _AUDIT_GCP_SKIP=0 once IAM is granted to enforce gating.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        # Install node (slim) just for this step; gcloud image has no node runtime.
        apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
        AUDIT_GCP_SKIP=${_AUDIT_GCP_SKIP} GCP_PROJECT_ID=$PROJECT_ID node scripts/audit-gcp.mjs
    id: 'preflight-audit-gcp'
    waitFor: ['check-model-strings']

  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'npm ci']
    id: 'install-node-deps'
    waitFor: ['preflight-audit-routes']

  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'npm run lint']
    id: 'lint'
    waitFor: ['install-node-deps']

  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'npx tsc --noEmit']
    id: 'typecheck'
    waitFor: ['install-node-deps']

  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'npm run audit:routes']
    id: 'audit-routes'
    waitFor: ['install-node-deps']

  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'echo "smoke:public is run locally and post-deploy; skipping predeploy Cloud Build browser smoke."']
    id: 'smoke-public'
    waitFor: ['typecheck']

  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'npm run build']
    id: 'build-app-gate'
    waitFor: ['lint', 'typecheck', 'audit-routes']

  # ── Firestore rules deploy — NOT automated via Cloud Build right now because
  # the Cloud Build service account lacks serviceusage.services.get permission.
  # Deploy rules manually after changes:
  #   firebase login   # one-time
  #   firebase deploy --only firestore:rules --project=praxisbytacitus
  # (Or grant the Cloud Build SA the Service Usage Consumer role and re-add
  # the step here — see https://firebase.google.com/docs/projects/iam/permissions)

  # ── Backend ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker build
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:${_SOURCE_COMMIT}
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:latest
        ./backend
    id: 'build-backend'
    waitFor: ['build-app-gate', 'preflight-audit-gcp']

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker build
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-pgbouncer:${_SOURCE_COMMIT}
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-pgbouncer:latest
        ./infrastructure/pgbouncer
    id: 'build-pgbouncer'
    waitFor: ['build-app-gate', 'preflight-audit-gcp']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:${_SOURCE_COMMIT}']
    id: 'push-backend-commit'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:latest']
    id: 'push-backend-latest'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-pgbouncer:${_SOURCE_COMMIT}']
    id: 'push-pgbouncer-commit'
    waitFor: ['build-pgbouncer']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-pgbouncer:latest']
    id: 'push-pgbouncer-latest'
    waitFor: ['build-pgbouncer']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-backend
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:${_SOURCE_COMMIT}'
      - '--region'
      - us-central1
      - '--no-allow-unauthenticated'
      - '--memory'
      - 2Gi
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--service-account'
      - 'praxis-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--network'
      - 'default'
      - '--subnet'
      - 'default'
      - '--vpc-egress'
      - 'private-ranges-only'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:us-east4:praxisbytacitus-instance'
      - '--set-env-vars'
      - '^|^GCP_PROJECT_ID=$PROJECT_ID|GCP_REGION=us-central1|DATABASE_URL=postgresql://praxis_app:$${DATABASE_PASSWORD}@localhost:6432/praxis|PGBOUNCER_HOST=localhost|PGBOUNCER_PORT=6432|LANGGRAPH_CHECKPOINT_BACKEND=postgres|LANGGRAPH_DB_INSTANCE_CONNECTION_NAME=$PROJECT_ID:us-east4:praxisbytacitus-instance|LANGGRAPH_DB_HOST=localhost|LANGGRAPH_DB_PORT=6432|LANGGRAPH_DB_NAME=praxis|LANGGRAPH_DB_USER=praxis_app|LANGGRAPH_DB_PASSWORD_SECRET=praxis-db-password|BACKEND_TRUSTED_SERVICE_ACCOUNTS=praxis-frontend-sa@$PROJECT_ID.iam.gserviceaccount.com,praxis-functions-sa@$PROJECT_ID.iam.gserviceaccount.com,praxis-worker-sa@$PROJECT_ID.iam.gserviceaccount.com|PRAXIS_BUILD_SOURCE=${_BUILD_SOURCE}|PRAXIS_SOURCE_REPO=${_SOURCE_REPO}|PRAXIS_SOURCE_BRANCH=${_SOURCE_BRANCH}|PRAXIS_SOURCE_COMMIT=${_SOURCE_COMMIT}|PRAXIS_BUILD_ID=$BUILD_ID'
      - '--labels'
      - 'source=${_BUILD_SOURCE},repo=a4-praxis-cloud-work,branch=${_SOURCE_BRANCH},commit=${_SOURCE_COMMIT}'
      # Secrets from Secret Manager (must be created before first deploy — see setup-gcp.sh)
      - '--set-secrets'
      - 'FIREBASE_SERVICE_ACCOUNT_KEY=praxis-firebase-sa:latest,GOOGLE_AI_API_KEY=praxis-google-ai-key:latest,USER_KEY_MASTER=praxis-user-key-master:latest,LANGGRAPH_DB_PASSWORD=praxis-db-password:latest,DATABASE_PASSWORD=praxis-db-password:latest,NEO4J_URI=NEO4J_URI:latest,NEO4J_USER=dialectica-neo4j-user:latest,NEO4J_PASSWORD=dialectica-neo4j-password:latest,NEO4J_DATABASE=dialectica-neo4j-database:latest'
    id: 'deploy-backend'
    waitFor: ['push-backend-commit', 'push-backend-latest', 'push-pgbouncer-commit', 'push-pgbouncer-latest']

  # ── Get backend URL for frontend build arg ───────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services describe praxis-backend
        --region=us-central1
        --format="value(status.url)"
        > /workspace/backend_url.txt
    id: 'get-backend-url'
    waitFor: ['deploy-backend']

  # ── Frontend ─────────────────────────────────────────────────────────────────
  # All NEXT_PUBLIC_* args are forwarded at build time because Firebase client
  # config validates presence at module-import time (Next.js 16 Turbopack
  # page-data collection evaluates them during `next build`).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker build
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:${_SOURCE_COMMIT}
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:latest
        --build-arg NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt)
        --build-arg NEXT_PUBLIC_SITE_URL=https://praxis.tacitus.me
        --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAHNn4zJdMaxJXziRNa9SmHRFKUvO1q9uA
        --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=praxisbytacitus.firebaseapp.com
        --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=praxisbytacitus
        --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=praxisbytacitus.firebasestorage.app
        --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=852128226674
        --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:852128226674:web:535f771c7a3568462c11eb
        --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-7R44KT7CDY
        --build-arg NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_KEY=AQ.Ab8RN6IXTdhsDEQPADTuABwbGTCSfvNt16sMuy0Xc95Anrh6Pw
        --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_KEY}
        --build-arg NEXT_PUBLIC_PRAXIS_BUILD_SOURCE=${_BUILD_SOURCE}
        --build-arg NEXT_PUBLIC_PRAXIS_SOURCE_REPO=${_SOURCE_REPO}
        --build-arg NEXT_PUBLIC_PRAXIS_SOURCE_BRANCH=${_SOURCE_BRANCH}
        --build-arg NEXT_PUBLIC_PRAXIS_SOURCE_COMMIT=${_SOURCE_COMMIT}
        --build-arg NEXT_PUBLIC_PRAXIS_BUILD_ID=$BUILD_ID
        .
    id: 'build-frontend'
    waitFor: ['get-backend-url']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:${_SOURCE_COMMIT}']
    id: 'push-frontend-commit'
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:latest']
    id: 'push-frontend-latest'
    waitFor: ['build-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-frontend
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:${_SOURCE_COMMIT}'
      - '--region'
      - us-central1
      - '--allow-unauthenticated'
      - '--memory'
      - 1Gi
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      # Vertex AI via Application Default Credentials (ADC) on Cloud Run. No
      # API key needed — the default service account has aiplatform.user role.
      # AI_PROVIDER=vertex tells providers.ts to prefer Vertex over Google AI.
      - '--set-env-vars'
      - '^|^AI_PROVIDER=vertex|GOOGLE_VERTEX_PROJECT=praxisbytacitus|GOOGLE_VERTEX_LOCATION=us-central1|VERTEX_AGENT_LOCATION=us-central1|GOOGLE_CLOUD_PROJECT=praxisbytacitus|AGENT_RUN_TASKS_PROJECT=praxisbytacitus|AGENT_RUN_TASKS_LOCATION=us-central1|AGENT_RUN_TASKS_QUEUE=agent-runs|AGENT_RUN_WORKER_BASE_URL=https://praxis.tacitus.me|AGENT_RUN_WORKER_SERVICE_ACCOUNT_EMAIL=praxis-agents-sa@praxisbytacitus.iam.gserviceaccount.com|AGENT_RUN_WORKER_OIDC_AUDIENCE=https://praxis.tacitus.me|VERTEX_GROUNDING_GOOGLE_SEARCH_ENABLED=true|RESEARCH_GRAPH_ENABLED=true|ADMIN_EMAIL_ALLOWLIST=giulio@tacitus.me,giuliocatanzariti@gmail.com|PRAXIS_BUILD_SOURCE=${_BUILD_SOURCE}|PRAXIS_SOURCE_REPO=${_SOURCE_REPO}|PRAXIS_SOURCE_BRANCH=${_SOURCE_BRANCH}|PRAXIS_SOURCE_COMMIT=${_SOURCE_COMMIT}|PRAXIS_BUILD_ID=$BUILD_ID'
      - '--labels'
      - 'source=${_BUILD_SOURCE},repo=a4-praxis-cloud-work,branch=${_SOURCE_BRANCH},commit=${_SOURCE_COMMIT}'
      - '--set-secrets'
      - 'FIREBASE_SERVICE_ACCOUNT_KEY=praxis-firebase-sa:latest,GOOGLE_AI_API_KEY=praxis-google-ai-key:latest,CRON_SECRET=praxis-cron-secret:latest,COOKIE_SIGNING_SECRET=praxis-cookie-secret:latest,SESSION_SECRET=praxis-cookie-secret:latest,USER_KEY_MASTER=praxis-user-key-master:latest,VERTEX_AGENT_ENGINE_ID=praxis-vertex-adk-engine-id:latest,PUBSUB_PUSH_SHARED_SECRET=praxis-pubsub-push-secret:latest,AGENT_RUNTIME_DATABASE_URL=praxis-agent-runtime-database-url:latest,EXA_API_KEY=praxis-exa-api-key:latest'
    id: 'deploy-frontend'
    waitFor: ['push-frontend-commit', 'push-frontend-latest']

  # ── Set frontend env vars: backend URL + Firebase public config ──────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services update praxis-frontend
        --region=us-central1
        --update-env-vars=NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt),NEXT_PUBLIC_SITE_URL=https://praxis.tacitus.me,NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAHNn4zJdMaxJXziRNa9SmHRFKUvO1q9uA,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=praxisbytacitus.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=praxisbytacitus,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=praxisbytacitus.firebasestorage.app,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=852128226674,NEXT_PUBLIC_FIREBASE_APP_ID=1:852128226674:web:535f771c7a3568462c11eb,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-7R44KT7CDY,NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_KEY=AQ.Ab8RN6IXTdhsDEQPADTuABwbGTCSfvNt16sMuy0Xc95Anrh6Pw,NEXT_PUBLIC_PRAXIS_BUILD_SOURCE=${_BUILD_SOURCE},NEXT_PUBLIC_PRAXIS_SOURCE_REPO=${_SOURCE_REPO},NEXT_PUBLIC_PRAXIS_SOURCE_BRANCH=${_SOURCE_BRANCH},NEXT_PUBLIC_PRAXIS_SOURCE_COMMIT=${_SOURCE_COMMIT},NEXT_PUBLIC_PRAXIS_BUILD_ID=$BUILD_ID
    id: 'set-frontend-env'
    waitFor: ['deploy-frontend']

  # ── Vendor _shared spine helper into each function source dir ─────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        for target in cloud_functions/on_situation_created cloud_functions/on_document_uploaded; do
          rm -rf "$target/_shared"
          cp -r cloud_functions/_shared "$target/_shared"
          echo "Vendored _shared into $target"
        done
    id: 'vendor-shared'
    waitFor: ['check-model-strings']

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:${_SOURCE_COMMIT}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-pgbouncer:${_SOURCE_COMMIT}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-pgbouncer:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:${_SOURCE_COMMIT}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend:latest'

substitutions:
  _BUILD_SOURCE: '${TRIGGER_NAME:-local-submit}'
  _SOURCE_REPO: 'sargonxg/A4_PRAXIS_CLOUD_Work'
  _SOURCE_BRANCH: '${BRANCH_NAME:-local}'
  _SOURCE_COMMIT: '${COMMIT_SHA:-manual}'
  # Enforce GCP readiness checks in Cloud Build. The Cloud Build service account
  # has the read-only audit roles documented in infrastructure/grant-cloudbuild-audit-iam.sh.
  _AUDIT_GCP_SKIP: '0'
  # Google Maps JavaScript API key (public, embedded at build-time). Leave
  # empty to render IntelligenceMap's SVG scatter fallback. Restrict the key
  # to your domain(s) before flipping it live.
  _GOOGLE_MAPS_KEY: ''

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
