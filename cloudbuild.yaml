steps:
  # ── Model string guard — must run before any build ──────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -rE "gemini-2\.0|gemini-2\.5|gemini-3-pro-preview" src/ backend/ --include="*.ts" --include="*.tsx" --include="*.py" 2>/dev/null; then
          echo "ERROR: Forbidden model strings found. Use src/lib/ai/providers.ts (frontend) or backend/config.py (backend)."
          exit 1
        fi
        echo "OK: no forbidden model strings"
    id: 'check-model-strings'

  # ── Preflight: AI-route calibration audit (zero-dep .mjs, no npm install) ──
  - name: 'node:22-slim'
    entrypoint: 'node'
    args: ['scripts/audit-ai-routes.mjs']
    id: 'preflight-audit-routes'
    waitFor: ['check-model-strings']

  # ── Preflight: GCP resource audit via gcloud (uses build-step default SA) ──
  # Requires Cloud Build SA to have reader roles on the target resources; see
  # infrastructure/grant-cloudbuild-audit-iam.sh for the exact bindings.
  # Set substitution _AUDIT_GCP_SKIP=0 once IAM is granted to enforce gating.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        # Install node (slim) just for this step; gcloud image has no node runtime.
        apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
        AUDIT_GCP_SKIP=${_AUDIT_GCP_SKIP} GCP_PROJECT_ID=$PROJECT_ID node scripts/audit-gcp.mjs
    id: 'preflight-audit-gcp'
    waitFor: ['check-model-strings']

  # ── Firestore rules deploy — NOT automated via Cloud Build right now because
  # the Cloud Build service account lacks serviceusage.services.get permission.
  # Deploy rules manually after changes:
  #   firebase login   # one-time
  #   firebase deploy --only firestore:rules --project=praxisbytacitus
  # (Or grant the Cloud Build SA the Service Usage Consumer role and re-add
  # the step here — see https://firebase.google.com/docs/projects/iam/permissions)

  # ── Backend ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend', './backend']
    id: 'build-backend'
    waitFor: ['check-model-strings']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend']
    id: 'push-backend'
    waitFor: ['build-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-backend
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend'
      - '--region'
      - us-central1
      - '--no-allow-unauthenticated'
      - '--memory'
      - 2Gi
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=us-central1'
      # Secrets from Secret Manager (must be created before first deploy — see setup-gcp.sh)
      - '--set-secrets'
      - 'FIREBASE_SERVICE_ACCOUNT_KEY=praxis-firebase-sa:latest,GOOGLE_AI_API_KEY=praxis-google-ai-key:latest,USER_KEY_MASTER=praxis-user-key-master:latest'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # ── Get backend URL for frontend build arg ───────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services describe praxis-backend
        --region=us-central1
        --format="value(status.url)"
        > /workspace/backend_url.txt
    id: 'get-backend-url'
    waitFor: ['deploy-backend']

  # ── Frontend ─────────────────────────────────────────────────────────────────
  # All NEXT_PUBLIC_* args are forwarded at build time because Firebase client
  # config validates presence at module-import time (Next.js 16 Turbopack
  # page-data collection evaluates them during `next build`).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker build
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend
        --build-arg NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt)
        --build-arg NEXT_PUBLIC_SITE_URL=https://praxis.tacitus.me
        --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAHNn4zJdMaxJXziRNa9SmHRFKUvO1q9uA
        --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=praxisbytacitus.firebaseapp.com
        --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=praxisbytacitus
        --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=praxisbytacitus.firebasestorage.app
        --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=852128226674
        --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:852128226674:web:535f771c7a3568462c11eb
        --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-7R44KT7CDY
        --build-arg NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_KEY=AQ.Ab8RN6IXTdhsDEQPADTuABwbGTCSfvNt16sMuy0Xc95Anrh6Pw
        --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_KEY}
        .
    id: 'build-frontend'
    waitFor: ['get-backend-url']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-frontend
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend'
      - '--region'
      - us-central1
      - '--allow-unauthenticated'
      - '--memory'
      - 1Gi
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      # VERTEX_AGENT_ENGINE_ID secret intentionally not mounted yet — when the
      # Vertex AI Agent Engine is provisioned, create the secret
      # `praxis-agent-engine-id` and add it back to this list. Until then, the
      # Deep Research Agent falls back to Gemini 3 + Grounded Search (handled
      # in src/lib/ai/vertex-agent.ts:31-32).
      # Vertex AI via Application Default Credentials (ADC) on Cloud Run. No
      # API key needed — the default service account has aiplatform.user role.
      # AI_PROVIDER=vertex tells providers.ts to prefer Vertex over Google AI.
      - '--set-env-vars'
      - 'AI_PROVIDER=vertex,GOOGLE_VERTEX_PROJECT=praxisbytacitus,GOOGLE_VERTEX_LOCATION=us-central1,GOOGLE_CLOUD_PROJECT=praxisbytacitus'
      - '--set-secrets'
      - 'FIREBASE_SERVICE_ACCOUNT_KEY=praxis-firebase-sa:latest,GOOGLE_AI_API_KEY=praxis-google-ai-key:latest,CRON_SECRET=praxis-cron-secret:latest,COOKIE_SIGNING_SECRET=praxis-cookie-secret:latest,SESSION_SECRET=praxis-cookie-secret:latest,USER_KEY_MASTER=praxis-user-key-master:latest'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

  # ── Set frontend env vars: backend URL + Firebase public config ──────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services update praxis-frontend
        --region=us-central1
        --update-env-vars=NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt),NEXT_PUBLIC_SITE_URL=https://praxis.tacitus.me,NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAHNn4zJdMaxJXziRNa9SmHRFKUvO1q9uA,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=praxisbytacitus.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=praxisbytacitus,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=praxisbytacitus.firebasestorage.app,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=852128226674,NEXT_PUBLIC_FIREBASE_APP_ID=1:852128226674:web:535f771c7a3568462c11eb,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-7R44KT7CDY,NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_KEY=AQ.Ab8RN6IXTdhsDEQPADTuABwbGTCSfvNt16sMuy0Xc95Anrh6Pw
    id: 'set-frontend-env'
    waitFor: ['deploy-frontend']

  # ── GDELT Worker Pool ──────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/gdelt-poller', './cloud_functions/gdelt_poller']
    id: 'build-gdelt-worker'
    waitFor: ['check-model-strings']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/gdelt-poller']
    id: 'push-gdelt-worker'
    waitFor: ['build-gdelt-worker']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - beta
      - run
      - worker-pools
      - update
      - gdelt-poller
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/praxis/gdelt-poller'
      - '--region=us-central1'
    id: 'deploy-gdelt-worker'
    waitFor: ['push-gdelt-worker']

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-backend'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/gdelt-poller'

substitutions:
  # Flip to '0' after running infrastructure/grant-cloudbuild-audit-iam.sh so the
  # GCP audit enforces rather than silently passes.
  _AUDIT_GCP_SKIP: '1'
  # Google Maps JavaScript API key (public, embedded at build-time). Leave
  # empty to render IntelligenceMap's SVG scatter fallback. Restrict the key
  # to your domain(s) before flipping it live.
  _GOOGLE_MAPS_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
