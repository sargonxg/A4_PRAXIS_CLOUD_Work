steps:
  # ── Backend ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/praxis-backend', './backend']
    id: 'build-backend'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/praxis-backend']
    id: 'push-backend'
    waitFor: ['build-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-backend
      - '--image'
      - 'gcr.io/$PROJECT_ID/praxis-backend'
      - '--region'
      - us-central1
      - '--allow-unauthenticated'
      - '--memory'
      - 2Gi
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=us-central1'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # ── Get backend URL for frontend build arg ───────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services describe praxis-backend
        --region=us-central1
        --format="value(status.url)"
        > /workspace/backend_url.txt
    id: 'get-backend-url'
    waitFor: ['deploy-backend']

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker build
        -t gcr.io/$PROJECT_ID/praxis-frontend
        --build-arg NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt)
        .
    id: 'build-frontend'
    waitFor: ['get-backend-url']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/praxis-frontend']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-frontend
      - '--image'
      - 'gcr.io/$PROJECT_ID/praxis-frontend'
      - '--region'
      - us-central1
      - '--allow-unauthenticated'
      - '--memory'
      - 1Gi
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/praxis-backend'
  - 'gcr.io/$PROJECT_ID/praxis-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
