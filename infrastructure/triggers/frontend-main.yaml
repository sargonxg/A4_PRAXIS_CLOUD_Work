# GCP Cloud Build trigger: push to main, opt-in via [deploy] token.
#
# Import once:
#   gcloud builds triggers import \
#     --source=infrastructure/triggers/frontend-main.yaml \
#     --project=praxisbytacitus
#
# The trigger filters on the HEAD commit message via a Cloud Build payload
# binding; only pushes whose commit message contains the literal token
# `[deploy]` will run the frontend Cloud Build. Routine work (docs, audits,
# graphify, visuals-in-progress) does not redeploy.

name: frontend-main-on-push
description: Opt-in deploy of praxis-frontend on push to main when the commit message contains [deploy].
filename: cloudbuild.frontend.yaml
github:
  owner: sargonxg
  name: A4_PRAXIS_CLOUD_Work
  push:
    branch: ^main$
includedFiles:
  - "src/**"
  - "public/**"
  - "next.config.*"
  - "tsconfig.json"
  - "package.json"
  - "package-lock.json"
  - "cloudbuild.frontend.yaml"
filter: 'build.substitutions["_COMMIT_MESSAGE"].contains("[deploy]")'
tags:
  - praxis-frontend
  - opt-in-deploy
substitutions:
  _DEPLOY_TOKEN: "[deploy]"
  _COMMIT_MESSAGE: "$(push.head_commit.message)"
