# GCP Cloud Build trigger: deploy frontend from GitHub main.
#
# Install with the 2nd-gen GitHub connection commands in README.md. This file
# records the intended trigger scope for review and audit.
#
# Every push to main that touches the frontend surface or frontend build
# contract runs cloudbuild.frontend.yaml and promotes praxis-frontend.

name: frontend-main-on-push
description: Deploy praxis-frontend from GitHub main when frontend app or build files change.
filename: cloudbuild.frontend.yaml
github:
  owner: sargonxg
  name: A4_PRAXIS_CLOUD_Work
  push:
    branch: ^main$
includedFiles:
  - "src/**"
  - "public/**"
  - "Dockerfile"
  - "next.config.*"
  - "tsconfig.json"
  - "package.json"
  - "package-lock.json"
  - "cloudbuild.frontend.yaml"
  - "infrastructure/triggers/frontend-main.yaml"
tags:
  - praxis-frontend
  - github-main-deploy
