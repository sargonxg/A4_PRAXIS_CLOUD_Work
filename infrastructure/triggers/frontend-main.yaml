# GCP Cloud Build trigger: push to main, opt-in via [deploy] token.
#
# Import once:
#   gcloud builds triggers import \
#     --source=infrastructure/triggers/frontend-main.yaml \
#     --project=praxisbytacitus
#
# The trigger filters on commit message; only pushes whose HEAD commit message
# contains the literal token `[deploy]` will run the frontend Cloud Build.
# Routine work (docs, audits, graphify, visuals-in-progress) does not redeploy.

name: frontend-main-on-push
description: Opt-in deploy of praxis-frontend on push to main when the commit message contains [deploy].
filename: cloudbuild.frontend.yaml
github:
  owner: sargonxg
  name: A4_PRAXIS_CLOUD_Work
  push:
    branch: ^main$
includedFiles:
  - "src/**"
  - "public/**"
  - "next.config.*"
  - "tsconfig.json"
  - "package.json"
  - "package-lock.json"
  - "cloudbuild.frontend.yaml"
# Commit-message gate. Cloud Build accepts a regex over the HEAD commit message
# via the `tags` field once trigger filtering is enabled. We keep the gate in
# the cloudbuild step itself as a defensive double-check.
tags:
  - praxis-frontend
  - opt-in-deploy
substitutions:
  _DEPLOY_TOKEN: "[deploy]"
