steps:
  # Fast path for frontend-only product/UI/tool-surface iterations.
  # Use the full cloudbuild.yaml when backend, worker, Cloud Function, IAM,
  # secrets, or infrastructure behavior changes.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -rE "gemini-2\.0|gemini-3-flash-preview|gemini-3\.1-pro-preview|gemini-3-pro-preview|claude-|gpt-|firecrawl|tavily|parallel-web|@ai-sdk/anthropic" src/ backend/ --include="*.ts" --include="*.tsx" --include="*.py" --exclude="providers.ts" --exclude="providers.py" 2>/dev/null; then
          echo "ERROR: Forbidden retired/unavailable model strings found. Use src/lib/ai/providers.ts (frontend) or backend/config.py (backend)."
          exit 1
        fi
        echo "OK: no forbidden model strings"
    id: 'check-model-strings'

  - name: 'node:22-slim'
    entrypoint: 'node'
    args: ['scripts/audit-ai-routes.mjs']
    id: 'preflight-audit-routes'
    waitFor: ['check-model-strings']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services describe praxis-backend
        --region=us-central1
        --format="value(status.url)"
        > /workspace/backend_url.txt
    id: 'get-backend-url'
    waitFor: ['check-model-strings']

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker build
        -t us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend
        --build-arg NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt)
        --build-arg NEXT_PUBLIC_SITE_URL=https://praxis.tacitus.me
        --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAHNn4zJdMaxJXziRNa9SmHRFKUvO1q9uA
        --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=praxisbytacitus.firebaseapp.com
        --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=praxisbytacitus
        --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=praxisbytacitus.firebasestorage.app
        --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=852128226674
        --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:852128226674:web:535f771c7a3568462c11eb
        --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-7R44KT7CDY
        --build-arg NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_KEY=AQ.Ab8RN6IXTdhsDEQPADTuABwbGTCSfvNt16sMuy0Xc95Anrh6Pw
        --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_KEY}
        .
    id: 'build-frontend'
    waitFor: ['preflight-audit-routes', 'get-backend-url']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - praxis-frontend
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend'
      - '--region'
      - us-central1
      - '--allow-unauthenticated'
      - '--memory'
      - 1Gi
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - '^|^AI_PROVIDER=vertex|GOOGLE_VERTEX_PROJECT=praxisbytacitus|GOOGLE_VERTEX_LOCATION=us-central1|VERTEX_AGENT_LOCATION=us-central1|GOOGLE_CLOUD_PROJECT=praxisbytacitus|ADMIN_EMAIL_ALLOWLIST=giulio@tacitus.me,giuliocatanzariti@gmail.com'
      - '--set-secrets'
      - 'FIREBASE_SERVICE_ACCOUNT_KEY=praxis-firebase-sa:latest,GOOGLE_AI_API_KEY=praxis-google-ai-key:latest,CRON_SECRET=praxis-cron-secret:latest,COOKIE_SIGNING_SECRET=praxis-cookie-secret:latest,SESSION_SECRET=praxis-cookie-secret:latest,USER_KEY_MASTER=praxis-user-key-master:latest,VERTEX_AGENT_ENGINE_ID=praxis-vertex-adk-engine-id:latest,PUBSUB_PUSH_SHARED_SECRET=praxis-pubsub-push-secret:latest'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - >-
        gcloud run services update praxis-frontend
        --region=us-central1
        --update-env-vars=NEXT_PUBLIC_PRAXIS_BACKEND_URL=$(cat /workspace/backend_url.txt),NEXT_PUBLIC_SITE_URL=https://praxis.tacitus.me,NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAHNn4zJdMaxJXziRNa9SmHRFKUvO1q9uA,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=praxisbytacitus.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=praxisbytacitus,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=praxisbytacitus.firebasestorage.app,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=852128226674,NEXT_PUBLIC_FIREBASE_APP_ID=1:852128226674:web:535f771c7a3568462c11eb,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-7R44KT7CDY,NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_KEY=AQ.Ab8RN6IXTdhsDEQPADTuABwbGTCSfvNt16sMuy0Xc95Anrh6Pw
    id: 'set-frontend-env'
    waitFor: ['deploy-frontend']

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/praxis/praxis-frontend'

substitutions:
  _GOOGLE_MAPS_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
