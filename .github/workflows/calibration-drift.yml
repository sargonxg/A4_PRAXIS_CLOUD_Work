name: calibration-drift

# Weekly audit: every AI route under src/app/api/ai/** must be wrapped in
# withCalibration (or be explicitly exempted in scripts/audit-ai-routes.mjs).
# Opens an issue on drift so calibration regressions surface without blocking
# hot deploys.

on:
  schedule:
    - cron: '0 13 * * 1' # every Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run calibration audit
        id: audit
        run: |
          set +e
          node scripts/audit-ai-routes.mjs | tee audit.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Open issue on drift
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('audit.log', 'utf8');
            const title = `Calibration drift detected — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'Weekly calibration audit found AI routes missing the `withCalibration` wrapper.',
              '',
              '```',
              log.trim(),
              '```',
              '',
              'Fix: wrap the offending route handler with `withCalibration(toolId, creditOp)` from `src/lib/api/with-calibration.ts`, or add the tool id to the `EXEMPT` set in `scripts/audit-ai-routes.mjs` with a comment explaining why.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'calibration-drift',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['calibration-drift'],
              });
            }

      - name: Fail the job if drift
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
