name: persona-smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  personas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        env:
          COOKIE_SIGNING_SECRET: persona-smoke-cookie-secret
        run: npm run build

      - name: Start app
        env:
          COOKIE_SIGNING_SECRET: persona-smoke-cookie-secret
        run: |
          npm run start -- -p 3000 > persona-smoke.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat persona-smoke.log
          exit 1

      - name: Run persona smoke suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run smoke:personas

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-smoke-server-log
          path: persona-smoke.log
