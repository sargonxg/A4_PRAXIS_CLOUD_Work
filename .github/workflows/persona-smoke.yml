name: persona-smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  personas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_FIREBASE_EMAIL: ${{ secrets.TEST_FIREBASE_EMAIL }}
      TEST_FIREBASE_PASSWORD: ${{ secrets.TEST_FIREBASE_PASSWORD }}
      REQUIRE_AUTH_GOLDEN_PATH: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      COOKIE_SIGNING_SECRET: praxis-dev-cookie-signing-secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify Firebase disposable test credentials
        run: |
          if [ -z "$TEST_FIREBASE_EMAIL" ] || [ -z "$TEST_FIREBASE_PASSWORD" ]; then
            echo "GitHub Actions secrets TEST_FIREBASE_EMAIL and TEST_FIREBASE_PASSWORD are required for persona-smoke authenticated E2E."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        env:
          COOKIE_SIGNING_SECRET: praxis-dev-cookie-signing-secret
        run: npm run build

      - name: Start app
        env:
          COOKIE_SIGNING_SECRET: praxis-dev-cookie-signing-secret
        run: |
          npm run start -- -p 3000 > persona-smoke.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat persona-smoke.log
          exit 1

      - name: Run Tasklet app smoke suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run smoke:tasklet-app

      - name: Run authenticated app smoke suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run smoke:authenticated-app

      - name: Run authenticated golden path proof
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/golden-path.spec.ts

      - name: Run live authenticated agentic canary
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PRAXIS_DOCTOR_WRITE_CANARY: "1"
          PRAXIS_CANARY_EMAIL: ${{ secrets.TEST_FIREBASE_EMAIL }}
          PRAXIS_CANARY_PASSWORD: ${{ secrets.TEST_FIREBASE_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: npm run doctor:praxis:canary -- --json

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: persona-smoke-server-log
          path: persona-smoke.log
