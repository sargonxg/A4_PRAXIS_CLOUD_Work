name: Public credential guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/audit-public-credentials.test.mjs
      - run: node scripts/audit-public-credentials.mjs
