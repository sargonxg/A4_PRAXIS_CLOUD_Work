steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis-workers/extract-docling:$SHORT_SHA
      - services/extract-docling
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis-workers/extract-docling:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - extract-docling
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis-workers/extract-docling:$SHORT_SHA
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      - --timeout=300
      - --max-instances=4
substitutions:
  _REGION: us-central1
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis-workers/extract-docling:$SHORT_SHA
