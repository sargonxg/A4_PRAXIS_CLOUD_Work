steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis/extract-graphrag:$SHORT_SHA
      - services/extract-graphrag
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis/extract-graphrag:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - extract-graphrag
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis/extract-graphrag:$SHORT_SHA
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --memory=8Gi
      - --cpu=4
      - --timeout=900
      - --max-instances=2
substitutions:
  _REGION: us-central1
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/praxis/extract-graphrag:$SHORT_SHA
