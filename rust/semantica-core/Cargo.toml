[package]
name = "praxis-semantica-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast PRAXIS semantic graph validation primitives for future Semantica workers."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "praxis_semantica_core"
path = "src/lib.rs"
